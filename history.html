<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>评论历史 - Auto Register Filler</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app-shell.css" />
    <link rel="stylesheet" href="styles/history.css" />
  </head>
  <body>
    <header data-app-shell></header>
    <main class="container">
      <h1>评论历史</h1>
      <div class="subtitle">近期评论优先从本机缓存读取；启用云同步后，可浏览更早的云端历史。</div>
      <div id="cloudHistoryStatus" class="cloud-history-status" role="status" aria-live="polite">
        正在检查云同步状态…
      </div>

      <section class="summary-grid" aria-label="评论历史摘要">
        <div class="summary-card">
          <div class="summary-label">总记录数</div>
          <div class="summary-value" id="summaryTotal">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">最近 24 小时</div>
          <div class="summary-value" id="summaryLast24Hours">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">即将到期（80–89 天）</div>
          <div class="summary-value warn" id="summaryDueSoon">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">已到期、待确认</div>
          <div class="summary-value danger" id="summaryExpired">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">浏览器存储估算</div>
          <div class="summary-value storage" id="summaryStorage">—</div>
        </div>
      </section>

      <div class="retention-banner" id="retentionBanner" role="status" hidden></div>
      <div class="retention-banner" id="historyPendingBanner" role="status" hidden></div>

      <section class="card">
        <h2>筛选评论</h2>
        <form id="historyFilterForm">
          <div class="filter-grid">
            <div>
              <label for="dateFrom">提交日期（开始）</label>
              <input id="dateFrom" name="dateFrom" type="date" />
            </div>
            <div>
              <label for="dateTo">提交日期（结束）</label>
              <input id="dateTo" name="dateTo" type="date" />
            </div>
            <div>
              <label for="targetDomain">目标网站域名</label>
              <input id="targetDomain" name="targetDomain" type="text" placeholder="example.com" />
            </div>
            <div>
              <label for="promotedDomain">推广网站域名</label>
              <input id="promotedDomain" name="promotedDomain" type="text" placeholder="promo.example" />
            </div>
            <div>
              <label for="profileId">Profile ID</label>
              <input id="profileId" name="profileId" type="text" placeholder="profile-id" />
            </div>
            <div>
              <label for="promotionSiteId">Promotion Site ID</label>
              <input id="promotionSiteId" name="promotionSiteId" type="text" placeholder="promotion-site-id" />
            </div>
            <div>
              <label for="anchorTextPrefix">锚文本前缀</label>
              <input id="anchorTextPrefix" name="anchorTextPrefix" type="text" placeholder="产品名" />
            </div>
            <div>
              <label for="hrefDomain">锚链接域名</label>
              <input id="hrefDomain" name="hrefDomain" type="text" placeholder="links.example" />
            </div>
          </div>
          <div class="filter-actions">
            <div class="filter-buttons">
              <button class="btn-primary" type="submit">应用筛选</button>
              <button class="btn-secondary" id="resetFiltersBtn" type="button">重置</button>
            </div>
            <div class="page-size-field">
              <label for="pageSize">每页</label>
              <select id="pageSize" name="pageSize">
                <option value="50">50 条</option>
                <option value="100">100 条</option>
              </select>
            </div>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="table-toolbar">
          <h2>评论记录</h2>
          <div class="lifecycle-actions">
            <button
              class="btn-secondary"
              id="exportHistoryBtn"
              type="button"
            >导出筛选记录 CSV</button>
            <button
              class="btn-danger"
              id="confirmDeleteBtn"
              type="button"
              disabled
              hidden
              title="完成导出后才能明确确认删除"
            >我已完成归档，确认删除</button>
          </div>
        </div>
        <p class="lifecycle-note">未启用云同步时，导出和删除是两个独立步骤，未经明确确认不会自动删除；启用后，仅已确认同步且无待处理更改的 90 天前本机缓存会自动清理。</p>
        <div id="exportStatus" role="status" aria-live="polite"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>详情</th>
                <th>提交时间</th>
                <th>目标页面</th>
                <th>推广网站</th>
                <th>身份</th>
                <th>推广配置</th>
                <th>评论内容</th>
                <th>来源</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="pageStatus"></span>
          <button class="btn-secondary" id="previousPageBtn" type="button" disabled>上一页</button>
          <span id="pageLabel">第 1 页</span>
          <button class="btn-secondary" id="nextPageBtn" type="button" disabled>下一页</button>
        </div>
      </section>

      <section class="card">
        <h2>历史归档摘要</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>删除完成时间</th>
                <th>范围开始</th>
                <th>范围结束</th>
                <th>记录数</th>
                <th>归档文件</th>
              </tr>
            </thead>
            <tbody id="archiveTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="history.js"></script>
  </body>
</html>
