<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>评论历史 - Auto Register Filler</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app-shell.css" />
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 24px;
        background: #f5f5f7;
        color: #1f1f1f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }

      h2 {
        margin: 0 0 14px;
        color: #374151;
        font-size: 15px;
      }

      .subtitle {
        margin-bottom: 8px;
        color: #6b7280;
        font-size: 13px;
      }

      .cloud-history-status {
        margin-bottom: 20px;
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 600;
      }

      .cloud-history-status.offline {
        color: #b45309;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .summary-card,
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }

      .summary-card {
        padding: 16px;
      }

      .summary-label {
        margin-bottom: 7px;
        color: #6b7280;
        font-size: 12px;
      }

      .summary-value {
        color: #1d4ed8;
        font-size: 24px;
        font-weight: 700;
      }

      .summary-value.warn { color: #b45309; }
      .summary-value.danger { color: #dc2626; }
      .summary-value.storage { font-size: 18px; }

      .retention-banner {
        margin-bottom: 16px;
        padding: 12px 16px;
        border: 1px solid #fcd34d;
        border-radius: 10px;
        background: #fffbeb;
        color: #92400e;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.5;
      }

      .card {
        margin-bottom: 16px;
        padding: 18px 20px;
      }

      .filter-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: 12px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #374151;
        font-size: 12px;
        font-weight: 600;
      }

      input,
      select {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        color: #1f2937;
        font: inherit;
        font-size: 13px;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
      }

      .filter-actions,
      .table-toolbar,
      .pagination,
      .lifecycle-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-actions {
        justify-content: space-between;
        margin-top: 14px;
      }

      .filter-buttons {
        display: flex;
        gap: 8px;
      }

      .page-size-field {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .page-size-field label { margin: 0; }
      .page-size-field select { width: auto; }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .btn-primary {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
      }

      .btn-secondary {
        border: 1px solid #e5e7eb;
        background: #f3f4f6;
        color: #374151;
      }

      .btn-danger {
        border: 1px solid #fecaca;
        background: #fee2e2;
        color: #b91c1c;
      }

      .permanent-delete-button {
        padding: 5px 9px;
        font-size: 11px;
        white-space: nowrap;
      }

      .table-toolbar {
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid #e5e7eb;
        border-radius: 9px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      th {
        padding: 10px;
        background: #f9fafb;
        color: #6b7280;
        text-align: left;
        white-space: nowrap;
      }

      td {
        padding: 10px;
        border-top: 1px solid #f3f4f6;
        color: #374151;
        vertical-align: top;
      }

      .time-cell {
        min-width: 130px;
        white-space: nowrap;
      }

      .url-cell {
        min-width: 190px;
        max-width: 260px;
        overflow-wrap: anywhere;
      }

      .url-cell a {
        color: #2563eb;
        text-decoration: none;
      }

      .comment-cell {
        min-width: 260px;
        max-width: 440px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .source-badge {
        display: inline-flex;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .source-local {
        background: #f3f4f6;
        color: #4b5563;
      }

      .source-cloud {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .expand-button {
        padding: 5px 9px;
        border: 1px solid #dbeafe;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 11px;
      }

      .detail-row td {
        padding: 0;
        background: #f8fafc;
      }

      .detail-content {
        padding: 14px 18px;
        color: #374151;
      }

      .stored-html {
        margin: 8px 0 14px;
        padding: 12px;
        overflow-x: auto;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        color: #1f2937;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .anchor-list {
        margin-top: 8px;
      }

      .anchor-item {
        margin-top: 5px;
        padding: 7px 9px;
        border-radius: 6px;
        background: #fff;
        overflow-wrap: anywhere;
      }

      .empty-cell {
        padding: 24px;
        color: #9ca3af;
        text-align: center;
      }

      .pagination {
        justify-content: flex-end;
        margin-top: 12px;
      }

      #pageLabel,
      #pageStatus {
        color: #6b7280;
        font-size: 12px;
      }

      #pageStatus {
        margin-right: auto;
      }

      #pageStatus.error { color: #dc2626; }

      .lifecycle-note {
        margin: 0 0 12px;
        color: #6b7280;
        font-size: 12px;
        line-height: 1.5;
      }

      #exportStatus {
        min-height: 18px;
        margin: -4px 0 12px;
        color: #1d4ed8;
        font-size: 12px;
      }

      #exportStatus.error { color: #dc2626; }

      @media (max-width: 900px) {
        .summary-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
        .filter-grid { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
      }

      @media (max-width: 560px) {
        body { padding: 14px; }
        .summary-grid,
        .filter-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header data-app-shell></header>
    <main class="container">
      <h1>评论历史</h1>
      <div class="subtitle">近期评论优先从本机缓存读取；启用云同步后，可浏览更早的云端历史。</div>
      <div id="cloudHistoryStatus" class="cloud-history-status" role="status" aria-live="polite">
        正在检查云同步状态…
      </div>

      <section class="summary-grid" aria-label="评论历史摘要">
        <div class="summary-card">
          <div class="summary-label">总记录数</div>
          <div class="summary-value" id="summaryTotal">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">最近 24 小时</div>
          <div class="summary-value" id="summaryLast24Hours">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">即将到期（80–89 天）</div>
          <div class="summary-value warn" id="summaryDueSoon">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">已到期、待确认</div>
          <div class="summary-value danger" id="summaryExpired">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">浏览器存储估算</div>
          <div class="summary-value storage" id="summaryStorage">—</div>
        </div>
      </section>

      <div class="retention-banner" id="retentionBanner" role="status" hidden></div>
      <div class="retention-banner" id="historyPendingBanner" role="status" hidden></div>

      <section class="card">
        <h2>筛选评论</h2>
        <form id="historyFilterForm">
          <div class="filter-grid">
            <div>
              <label for="dateFrom">提交日期（开始）</label>
              <input id="dateFrom" name="dateFrom" type="date" />
            </div>
            <div>
              <label for="dateTo">提交日期（结束）</label>
              <input id="dateTo" name="dateTo" type="date" />
            </div>
            <div>
              <label for="targetDomain">目标网站域名</label>
              <input id="targetDomain" name="targetDomain" type="text" placeholder="example.com" />
            </div>
            <div>
              <label for="promotedDomain">推广网站域名</label>
              <input id="promotedDomain" name="promotedDomain" type="text" placeholder="promo.example" />
            </div>
            <div>
              <label for="anchorTextPrefix">锚文本前缀</label>
              <input id="anchorTextPrefix" name="anchorTextPrefix" type="text" placeholder="产品名" />
            </div>
            <div>
              <label for="hrefDomain">锚链接域名</label>
              <input id="hrefDomain" name="hrefDomain" type="text" placeholder="links.example" />
            </div>
          </div>
          <div class="filter-actions">
            <div class="filter-buttons">
              <button class="btn-primary" type="submit">应用筛选</button>
              <button class="btn-secondary" id="resetFiltersBtn" type="button">重置</button>
            </div>
            <div class="page-size-field">
              <label for="pageSize">每页</label>
              <select id="pageSize" name="pageSize">
                <option value="50">50 条</option>
                <option value="100">100 条</option>
              </select>
            </div>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="table-toolbar">
          <h2>评论记录</h2>
          <div class="lifecycle-actions">
            <button
              class="btn-secondary"
              id="exportHistoryBtn"
              type="button"
            >导出筛选记录 CSV</button>
            <button
              class="btn-danger"
              id="confirmDeleteBtn"
              type="button"
              disabled
              hidden
              title="完成导出后才能明确确认删除"
            >我已完成归档，确认删除</button>
          </div>
        </div>
        <p class="lifecycle-note">未启用云同步时，导出和删除是两个独立步骤，未经明确确认不会自动删除；启用后，仅已确认同步且无待处理更改的 90 天前本机缓存会自动清理。</p>
        <div id="exportStatus" role="status" aria-live="polite"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>详情</th>
                <th>提交时间</th>
                <th>目标页面</th>
                <th>推广网站</th>
                <th>评论内容</th>
                <th>来源</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="pageStatus"></span>
          <button class="btn-secondary" id="previousPageBtn" type="button" disabled>上一页</button>
          <span id="pageLabel">第 1 页</span>
          <button class="btn-secondary" id="nextPageBtn" type="button" disabled>下一页</button>
        </div>
      </section>

      <section class="card">
        <h2>历史归档摘要</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>删除完成时间</th>
                <th>范围开始</th>
                <th>范围结束</th>
                <th>记录数</th>
                <th>归档文件</th>
              </tr>
            </thead>
            <tbody id="archiveTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="history.js"></script>
  </body>
</html>
