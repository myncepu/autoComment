<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="description" content="A local browser-extension test article about practical website accessibility." />
  <title>Local Accessibility Article</title>
</head>
<body data-fixture-target="{{TARGET_ID}}">
  <main id="fixture-page" data-target-id="{{TARGET_ID}}" data-delay-ms="{{DELAY_MS}}">
    <article>
      <h1>{{PAGE_TITLE}}</h1>
      <p>Use clear labels, keyboard navigation, readable contrast, and useful alternative text.</p>
    </article>
    <section aria-labelledby="fixture-controls-title">
      <h2 id="fixture-controls-title">Local fixture controls</h2>
      <p>Requested path: <code id="requested-path">{{REQUESTED_PATH}}</code></p>
      <p>Model delay: <output id="fixture-delay">{{DELAY_MS}}</output> ms</p>
    </section>
    <!-- PUBLISHED_COMMENTS -->
    <form id="commentform">
      <label>Name <input id="author" name="author" /></label>
      <label>Email <input id="email" name="email" type="email" /></label>
      <label>Password <input id="password" name="password" type="password" /></label>
      <label>Website <input id="url" name="url" type="url" /></label>
      <label>Comment <textarea id="comment" name="comment"></textarea></label>
      <button id="submit" type="submit">Post Comment</button>
    </form>
    <output id="submit-result"></output>
  </main>
  <!-- LOCAL_SUBMIT_HANDLER -->
  <script>LocalFixtureSubmit.installLocalSubmitHandler(document);</script>
</body>
</html>
